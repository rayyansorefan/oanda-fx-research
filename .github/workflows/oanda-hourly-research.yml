name: OANDA FX read-only research data
on:
  workflow_dispatch:
  # One-time validation when maintained code is deployed, not a second periodic scan.
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'signals.json'
      - 'validation_protocol.json'
      - 'paper-trade-candidates.json'
      - '.github/workflows/oanda-hourly-research.yml'
  schedule:
    # Best-effort :11 UTC dispatch to refresh the :15 London review.
    # Shift off the previous :07 cron to resync GitHub's registered schedule
    # after missing dispatches on 4 Nov. Same run count; not an SLA or proof
    # that the 15-minute fast-monitoring workflow is dispatching.
    - cron: '11 * * * 1-5'
    # Sunday FX reopen: same hourly count, shifted away from :07.
    - cron: '11 21-23 * * 0'
    # Independent ~07:19 London fallback to refresh the 07:30 full brief if the :07 runner was late.
    # Two small UTC slots accommodate UK daylight saving; best effort only.
    # GitHub runners are NOT an SLA; delayed or skipped cron still possible.
    - cron: '19 6,7 * * 1-5'
    # Independent staggered fast backup; cron actor is registered by this workflow.
    # Uses ONE lightweight fast scan only when the frozen primary fast workflow
    # did not already produce a recent, valid pair-specific observation.
    # No additional OANDA requests when the normal fast monitor succeeded.
    # GitHub dispatch is best-effort; this is redundancy, NOT an SLA.
    - cron: '4,19,34,49 7-18 * * 1-5'
      timezone: Europe/London
permissions:
  contents: write
  actions: read
concurrency:
  group: oanda-research-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    # Dedicated backup tick must not start the expensive all-pair collector.
    if: github.event_name != 'schedule' || github.event.schedule != '4,19,34,49 7-18 * * 1-5'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          # Delayed scheduled events can reference an obsolete commit. Start
          # from current main so persistence compares against the latest data.
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Record run provenance
        run: echo "FX_FAILURE_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Fetch OANDA raw data (GET only)
        id: collect
        continue-on-error: true
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        run: python scripts/oanda_data.py
      - name: Monitor economic releases and new market headlines (free public sources)
        id: news
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python scripts/news_watch.py
      # Raw evidence must survive a strategy test / protocol failure.
      - name: Offline safety tests (block signals, not collection)
        id: safety
        continue-on-error: true
        run: python -m unittest discover -s tests -v
      - name: Evaluate frozen shortlisted FX paper trades against subsequent bid/ask bars
        id: paper
        if: steps.safety.outcome == 'success' && steps.collect.outcome == 'success'
        continue-on-error: true
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
        run: python scripts/paper_trade_audit.py
      - name: Register and compare prospective momentum and pullback research opportunities
        id: opportunities
        if: steps.safety.outcome == 'success' && steps.collect.outcome == 'success'
        continue-on-error: true
        run: python scripts/opportunity_tracker.py
      - name: Audit missed forward FX research entries with actual later OANDA bid-ask candles
        id: missed
        if: steps.safety.outcome == 'success' && steps.collect.outcome == 'success' && steps.opportunities.outcome == 'success'
        continue-on-error: true
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
        run: python scripts/missed_entry_audit.py
      - name: Record every independent admission gate and hidden news blockers
        id: diagnostics
        if: steps.safety.outcome == 'success' && steps.collect.outcome == 'success' && steps.news.outcome == 'success'
        continue-on-error: true
        run: python scripts/admission_diagnostics.py
      - name: Freeze qualified prospective conditional manual FX signals
        id: admission
        if: steps.safety.outcome == 'success' && steps.collect.outcome == 'success' && steps.news.outcome == 'success'
        continue-on-error: true
        run: python scripts/signal_admission.py
      - name: Compare frozen champion and challenger paper cohorts (never live promotion)
        id: comparison
        if: steps.safety.outcome == 'success' && steps.collect.outcome == 'success' && steps.news.outcome == 'success'
        continue-on-error: true
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
        run: python scripts/strategy_comparison.py
      - name: Evaluate separately frozen simple momentum/pullback paper shadow (no orders)
        id: simple_shadow
        if: steps.safety.outcome == 'success' && steps.collect.outcome == 'success' && steps.news.outcome == 'success' && steps.comparison.outcome == 'success'
        continue-on-error: true
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
        run: |
          python scripts/simple_paper_shadow.py
          python scripts/simple_paper_shadow_v2.py
      - name: Collect separately locked 4 November early forward paper cohort
        id: early_cohort
        if: steps.safety.outcome == 'success' && steps.collect.outcome == 'success' && steps.news.outcome == 'success' && steps.comparison.outcome == 'success' && steps.simple_shadow.outcome == 'success'
        continue-on-error: true
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
        run: python scripts/early_forward_start.py
      - name: Explain frozen simple-paper research blockers without inventing trades
        id: paper_gates
        if: steps.collect.outcome == 'success' && steps.safety.outcome == 'success' && steps.early_cohort.outcome == 'success'
        continue-on-error: true
        run: python scripts/simple_shadow_gate_diagnostics.py
      - name: Audit prospective paper portfolio limits and additional cost stress
        id: portfolio
        if: steps.safety.outcome == 'success' && steps.collect.outcome == 'success' && steps.comparison.outcome == 'success'
        continue-on-error: true
        run: python scripts/paper_portfolio_audit.py
      - name: Forward-test FX exit management on confirmed OANDA paper entries
        id: exit_management
        if: steps.safety.outcome == 'success' && steps.collect.outcome == 'success' && steps.comparison.outcome == 'success'
        continue-on-error: true
        run: python scripts/exit_management_research.py
      - name: Reassess approved setups against price AND news/event risk
        id: watch
        if: steps.safety.outcome == 'success' && steps.collect.outcome == 'success' && steps.admission.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/signal_watch.py
      - name: Audit locked forward validation, coverage and actual delivery evidence
        id: validation
        if: steps.safety.outcome == 'success' && steps.collect.outcome == 'success' && steps.comparison.outcome == 'success' && steps.watch.outcome == 'success'
        continue-on-error: true
        run: python scripts/forward_validation.py
      - name: Independently audit admission filters and holdout strategy evidence
        id: strategy_audit
        if: steps.safety.outcome == 'success' && steps.collect.outcome == 'success' && steps.diagnostics.outcome == 'success' && steps.comparison.outcome == 'success' && steps.validation.outcome == 'success'
        continue-on-error: true
        run: python scripts/entry_strategy_audit.py
      - name: Recover missing fast observation once using unchanged frozen scanner
        id: fast_recovery
        if: steps.collect.outcome == 'success' && steps.safety.outcome == 'success' && steps.news.outcome == 'success' && steps.early_cohort.outcome == 'success'
        continue-on-error: true
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        run: python scripts/monitoring_health.py --fast-if-due
      - name: Reconcile unique frozen FX plans and paper-trade lifecycles
        id: lifecycle
        if: steps.collect.outcome == 'success' && steps.safety.outcome == 'success' && steps.comparison.outcome == 'success'
        continue-on-error: true
        run: python scripts/lifecycle_audit.py
      - name: Record independent economic reconciliation and actual workflow clocks
        id: independent_audit
        if: steps.lifecycle.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/independent_operational_audit.py
      - name: Record monitoring gaps and actual scheduler evidence
        id: monitoring
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FX_MONITOR_OUTCOMES: '{"collect":"${{ steps.collect.outcome }}","safety":"${{ steps.safety.outcome }}","early_cohort":"${{ steps.early_cohort.outcome }}","fast_recovery":"${{ steps.fast_recovery.outcome }}"}'
        run: python scripts/monitoring_health.py
      - name: Publish sanitized FX research to existing HTML dashboard
        id: dashboard
        if: steps.collect.outcome == 'success' && steps.news.outcome == 'success'
        # Export failure must be reported after persisting diagnostic status.
        continue-on-error: true
        env:
          FX_DASHBOARD_DEPLOY_TOKEN: ${{ secrets.FX_DASHBOARD_DEPLOY_TOKEN }}
          FX_SAFETY_OUTCOME: ${{ steps.safety.outcome }}
          FX_ADMISSION_OUTCOME: ${{ steps.admission.outcome }}
          FX_WATCH_OUTCOME: ${{ steps.watch.outcome }}
        run: python scripts/export_public_dashboard.py
      - name: Mark deployed FX assessment unavailable on collection or publication failure
        id: health_fallback
        if: always() && (steps.collect.outcome != 'success' || steps.news.outcome != 'success' || steps.dashboard.outcome != 'success')
        continue-on-error: true
        env:
          FX_DASHBOARD_DEPLOY_TOKEN: ${{ secrets.FX_DASHBOARD_DEPLOY_TOKEN }}
          FX_HEALTH_FAILURE: ${{ steps.collect.outcome != 'success' && 'MARKET_COLLECTION_FAILED' || steps.news.outcome != 'success' && 'NEWS_COLLECTION_FAILED' || 'PUBLICATION_FAILED' }}
        run: python scripts/publish_health_status.py
      - name: Save timestamped snapshot and watcher state
        id: persist
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Capture the exact source snapshot at checkout so an older running
          # collector can NEVER replace data already published by a newer run.
          original_summary_blob="$(git rev-parse HEAD:data/summary.json 2>/dev/null || true)"
          git add -A data/
          if [ -f signals.json ]; then git add -- signals.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: update timestamped OANDA research snapshot [skip ci]"
            published=false
            for attempt in 1 2 3; do
              git fetch origin main
              remote_summary_blob="$(git rev-parse origin/main:data/summary.json 2>/dev/null || true)"
              if [ "$remote_summary_blob" != "$original_summary_blob" ]; then
                # Another run changed the source. A verified newer snapshot
                # supersedes this one; never replace or falsely fail for it.
                # Older, malformed or missing data remain hard failures.
                git show origin/main:data/summary.json > /tmp/remote-summary.json || exit 1
                if python -c 'import json,datetime,sys; parse=lambda path: json.load(open(path)); local=parse("data/summary.json"); remote=parse("/tmp/remote-summary.json"); iso=lambda row: datetime.datetime.fromisoformat(row["collected_at"].replace("Z","+00:00")); sys.exit(0 if remote.get("status") in ("OK","PARTIAL") and iso(remote)>iso(local) else 1)'; then
                  echo '::notice::Newer complete FX snapshot already published; obsolete run safely superseded.'
                  exit 0
                fi
                echo '::error::Competing snapshot is not verified newer and valid; refusing overwrite.'
                exit 1
              fi
              # A source-code or workflow merge may have advanced main while
              # data remained unchanged. Rebase and safely retry that race.
              git rebase origin/main
              if git push origin HEAD:main; then
                published=true
                break
              fi
              echo "::warning::Main changed again; verifying source timestamp before retry $attempt/3"
              sleep 2
            done
            if [ "$published" != true ]; then
              echo '::error::Could not safely persist OANDA research after bounded retries.'
              exit 1
            fi
          fi
      # Scheduled research is persisted in data/. User-facing hourly updates are
      # delivered by the separate ChatGPT task, not by GitHub Issues.
      - name: Preserve evidence artifact if repository persistence fails
        if: always() && steps.persist.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fx-unpersisted-observations-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          path: |
            data/monitoring_health.json
            data/fast_entry_audit.json
            data/fast_latest.json
            data/fast_entry_history.json
            data/early_simple_paper_shadow.json
            data/early_forward_validation.json
            data/strategy_comparison.json
            data/simple_paper_shadow_v2.json
            data/signal_plan_archive.json
            data/signal_delivery_audit.json
            data/paper_trade_ledger.json
            signals.json
      - name: Fail visibly when monitoring recovery or diagnostics failed
        if: always() && (steps.monitoring.outcome != 'success' || steps.fast_recovery.outcome == 'failure')
        run: exit 1
      - name: Fail closed if any research or public dashboard step failed
        if: steps.lifecycle.outcome != 'success' || steps.safety.outcome != 'success' || steps.collect.outcome != 'success' || steps.news.outcome != 'success' || steps.admission.outcome != 'success' || steps.paper.outcome != 'success' || steps.opportunities.outcome != 'success' || steps.missed.outcome != 'success' || steps.watch.outcome != 'success' || steps.dashboard.outcome != 'success' || steps.persist.outcome != 'success' || steps.comparison.outcome != 'success' || steps.exit_management.outcome != 'success' || steps.diagnostics.outcome != 'success' || steps.validation.outcome != 'success' || steps.strategy_audit.outcome != 'success' || steps.portfolio.outcome != 'success' || steps.simple_shadow.outcome != 'success' || steps.early_cohort.outcome != 'success' || steps.paper_gates.outcome != 'success'
        run: exit 1

  fast-tick:
    # Backup is intentionally in the existing hourly WORKFLOW, not a new repo
    # or provider. Existing frozen .github/workflows/oanda-fast-entry.yml remains
    # unchanged so v21 and simple-v2 evidence hashes do not drift.
    if: github.event_name == 'schedule' && github.event.schedule == '4,19,34,49 7-18 * * 1-5'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test frozen fast research safety before optional recovery
        id: safety
        run: |
          for suite in test_fast_entry_scan.py test_signal_admission.py test_watchlist_validation.py test_paper_evidence_guard.py test_simple_paper_shadow_v2.py test_simple_shadow_gate_diagnostics.py test_source_freshness_fallback.py; do
            python -m unittest discover -s tests -p "$suite" -q || exit 1
          done
      - name: Restore source coverage if hourly OANDA schedule was missed
        id: source
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        run: python scripts/source_freshness_fallback.py
      - name: Continue unchanged prospective ledgers after source recovery
        id: paper_catchup
        if: steps.source.outputs.refreshed == 'true'
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
        run: |
          python scripts/news_watch.py
          python scripts/strategy_comparison.py
          python scripts/simple_paper_shadow.py
          python scripts/simple_paper_shadow_v2.py
          python scripts/early_forward_start.py
      - name: Capture fast observation only if original monitor is overdue
        id: fast
        if: steps.source.outcome == 'success' && (steps.source.outputs.refreshed != 'true' || steps.paper_catchup.outcome == 'success')
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        run: |
          python scripts/monitoring_health.py --fast-if-due
          if git diff --quiet -- data/fast_entry_audit.json; then
            echo "collected=false" >> "$GITHUB_OUTPUT"
            echo "Original fast monitor already fresh: no duplicate scan"
          else
            echo "collected=true" >> "$GITHUB_OUTPUT"
            echo "Backup collected a new observable fast market snapshot"
          fi
      - name: Verify original immutable forward ledgers after new observation
        id: validation
        if: steps.fast.outputs.collected == 'true'
        run: python scripts/forward_validation.py
      - name: Attribute paper strategy zero-setup gates (no live approvals)
        id: paper_gates
        if: steps.fast.outputs.collected == 'true'
        run: python scripts/simple_shadow_gate_diagnostics.py --fast
      - name: Update public feed only after a genuine newly observed scan
        id: publish
        if: steps.fast.outputs.collected == 'true' && steps.validation.outcome == 'success'
        env:
          FX_DASHBOARD_DEPLOY_TOKEN: ${{ secrets.FX_DASHBOARD_DEPLOY_TOKEN }}
          FX_SAFETY_OUTCOME: success
          FX_ADMISSION_OUTCOME: success
          FX_WATCH_OUTCOME: success
        run: python scripts/export_public_dashboard.py
      - name: Record real scheduler event and monitoring gap evidence
        id: monitoring
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FX_MONITOR_OUTCOMES: '{"collect":"skipped","safety":"${{ steps.safety.outcome }}","early_cohort":"skipped","fast_recovery":"${{ steps.fast.outcome }}"}'
        run: python scripts/monitoring_health.py
      - name: Persist actual observations and fail rather than overwrite races
        id: persist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/ signals.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: fast backup cadence receipt [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || exit 1
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Preserve unpersisted research privately when push fails
        if: always() && steps.persist.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fx-backup-unpersisted-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          path: |
            data/fast_latest.json
            data/fast_entry_audit.json
            data/simple_paper_shadow_v2.json
            data/simple_shadow_gate_diagnostics.json
            data/strategy_comparison.json
            data/monitoring_health.json
            signals.json
      - name: Fail closed if backup, publication, or persistence failed
        if: always() && (steps.safety.outcome != 'success' || steps.source.outcome != 'success' || (steps.source.outputs.refreshed == 'true' && steps.paper_catchup.outcome != 'success') || steps.fast.outcome != 'success' || steps.monitoring.outcome != 'success' || steps.persist.outcome != 'success' || (steps.fast.outputs.collected == 'true' && (steps.validation.outcome != 'success' || steps.paper_gates.outcome != 'success' || steps.publish.outcome != 'success')))
        run: exit 1
