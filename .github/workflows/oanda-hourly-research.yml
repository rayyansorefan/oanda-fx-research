name: OANDA FX read-only research data
on:
  workflow_dispatch:
  # One-time validation when maintained code is deployed, not a second periodic scan.
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/oanda-hourly-research.yml'
  schedule:
    # Hourly only, weekdays 06:43–18:43 UTC. Cron changed to re-register the schedule after zero automatic runs. Full OANDA account FX-universe M15/H1 screening with compact data publication.
    # Independent of ChatGPT usage. May miss short-lived M15 entry triggers.
    - cron: '43 6-18 * * 1-5'
    # Independent morning fallback 25 min before 07:30 London in BST/GMT.
    # Two small UTC slots accommodate UK daylight saving; best effort only.
    # GitHub runners are NOT an SLA; delayed or skipped cron still possible.
    - cron: '5 6,7 * * 1-5'
permissions:
  contents: write
  issues: write
concurrency:
  group: oanda-research-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Offline safety tests
        run: python -m unittest discover -s tests -v
      - name: Fetch OANDA raw data (GET only)
        id: collect
        continue-on-error: true
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        run: python scripts/oanda_data.py
      - name: Monitor economic releases and new market headlines (free public sources)
        id: news
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python scripts/news_watch.py
      - name: Reassess approved setups against price AND news/event risk
        id: watch
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/signal_watch.py
      - name: Save timestamped snapshot and watcher state
        id: persist
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "data: update timestamped OANDA research snapshot [skip ci]"
            git push
          fi
      - name: Deliver one hourly GitHub issue confirming actual completion
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SCHEDULE: ${{ github.event.schedule }}
          FX_COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          FX_NEWS_OUTCOME: ${{ steps.news.outcome }}
          FX_WATCH_OUTCOME: ${{ steps.watch.outcome }}
          FX_PERSIST_OUTCOME: ${{ steps.persist.outcome }}
        run: python scripts/hourly_delivery.py
      - name: Fail closed if any research step failed
        if: steps.collect.outcome != 'success' || steps.news.outcome != 'success' || steps.watch.outcome != 'success' || steps.persist.outcome != 'success'
        run: exit 1
