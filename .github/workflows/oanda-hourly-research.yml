name: OANDA FX read-only research data
on:
  workflow_dispatch:
  # One-time validation when maintained code is deployed, not a second periodic scan.
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/oanda-hourly-research.yml'
  schedule:
    # Hourly around the clock Monday–Friday UTC plus Sunday 21:43–23:43 UTC for FX reopen. Cron changed to re-register the schedule after zero automatic runs. Full OANDA account FX-universe M15/H1 screening with compact data publication.
    # Independent of ChatGPT usage. May miss short-lived M15 entry triggers.
    - cron: '43 * * * 1-5'
    # Sunday reopen: liquid FX market typically resumes late evening UTC.
    - cron: '43 21-23 * * 0'
    # Independent morning fallback 25 min before 07:30 London in BST/GMT.
    # Two small UTC slots accommodate UK daylight saving; best effort only.
    # GitHub runners are NOT an SLA; delayed or skipped cron still possible.
    - cron: '5 6,7 * * 1-5'
permissions:
  contents: write
concurrency:
  group: oanda-research-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Offline safety tests
        run: python -m unittest discover -s tests -v
      - name: Fetch OANDA raw data (GET only)
        id: collect
        continue-on-error: true
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        run: python scripts/oanda_data.py
      - name: Monitor economic releases and new market headlines (free public sources)
        id: news
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python scripts/news_watch.py
      - name: Reassess approved setups against price AND news/event risk
        id: watch
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/signal_watch.py
      - name: Send opt-in private WhatsApp FX alerts (approved Meta template)
        id: whatsapp
        if: steps.watch.outcome == 'success'
        continue-on-error: true
        env:
          FX_WA_ACCESS_TOKEN: ${{ secrets.FX_WA_ACCESS_TOKEN }}
          FX_WA_PHONE_NUMBER_ID: ${{ secrets.FX_WA_PHONE_NUMBER_ID }}
          FX_WA_RECIPIENT: ${{ secrets.FX_WA_RECIPIENT }}
          FX_WA_TEMPLATE_NAME: ${{ secrets.FX_WA_TEMPLATE_NAME }}
        run: python scripts/whatsapp_alerts.py
      - name: Publish sanitized FX research to existing HTML dashboard
        id: dashboard
        if: steps.collect.outcome == 'success' && steps.news.outcome == 'success'
        continue-on-error: true
        env:
          FX_DASHBOARD_DEPLOY_TOKEN: ${{ secrets.FX_DASHBOARD_DEPLOY_TOKEN }}
        run: python scripts/export_public_dashboard.py
      - name: Save timestamped snapshot and watcher state
        id: persist
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Capture the exact source snapshot at checkout so an older running
          # collector can NEVER replace data already published by a newer run.
          original_summary_blob="$(git rev-parse HEAD:data/summary.json 2>/dev/null || true)"
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "data: update timestamped OANDA research snapshot [skip ci]"
            published=false
            for attempt in 1 2 3; do
              git fetch origin main
              remote_summary_blob="$(git rev-parse origin/main:data/summary.json 2>/dev/null || true)"
              if [ "$remote_summary_blob" != "$original_summary_blob" ]; then
                echo '::error::Newer source research published concurrently; refusing to overwrite its data.'
                exit 1
              fi
              # A source-code or workflow merge may have advanced main while
              # data remained unchanged. Rebase and safely retry that race.
              git rebase origin/main
              if git push origin HEAD:main; then
                published=true
                break
              fi
              echo "::warning::Main changed again; verifying source timestamp before retry $attempt/3"
              sleep 2
            done
            if [ "$published" != true ]; then
              echo '::error::Could not safely persist OANDA research after bounded retries.'
              exit 1
            fi
          fi
      # Scheduled research is persisted in data/. User-facing hourly updates are
      # delivered by the separate ChatGPT task, not by GitHub Issues.
      - name: Fail closed if any research step failed
        if: steps.collect.outcome != 'success' || steps.news.outcome != 'success' || steps.watch.outcome != 'success' || steps.persist.outcome != 'success'
        run: exit 1
