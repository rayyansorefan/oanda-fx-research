name: Test WhatsApp FX channel (one-off)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/whatsapp-send-request.txt'
permissions:
  contents: read
jobs:
  send-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Regression test the delivery test harness without sending
        run: python -m unittest discover -s tests -p 'test_whatsapp_live_test.py' -v
      - name: Send an explicitly labelled TEST ONLY message to the opted-in recipient
        env:
          FX_WA_ACCESS_TOKEN: ${{ secrets.FX_WA_ACCESS_TOKEN }}
          FX_WA_PHONE_NUMBER_ID: ${{ secrets.FX_WA_PHONE_NUMBER_ID }}
          FX_WA_RECIPIENT: ${{ secrets.FX_WA_RECIPIENT }}
          FX_WA_TEMPLATE_NAME: ${{ secrets.FX_WA_TEMPLATE_NAME }}
        run: python -m scripts.whatsapp_live_test
      - name: Preserve sanitised delivery test receipt, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-channel-test-result
          path: data/whatsapp_live_test_result.json
          if-no-files-found: warn
          retention-days: 7
