name: FX fast shortlisted entry research (read-only)
on:
  workflow_dispatch:
  # Run the existing fast pipeline once when its code is deployed.
  push:
    branches: [main]
    paths:
      - 'scripts/fast_entry_scan.py'
      - 'scripts/export_public_dashboard.py'
      - 'scripts/oanda_data.py'
      - 'tests/test_fast_entry_scan.py'
      - '.github/workflows/oanda-fast-entry.yml'
  schedule:
    # Reallocate the SAME 48 weekday dispatches across the active London day.
    # Former two-window 5-minute schedule omitted most trading hours.
    # 07-19 every 15 minutes; hourly collection continues outside this window.
    # No extra scheduled fast-run count or guaranteed runner-start SLA.
    - cron: '2,17,32,47 7-18 * * 1-5'
      timezone: Europe/London
# Nonsecret endpoint selector. Set repository variable OANDA_ENVIRONMENT=live
# only when the stored OANDA token/account belongs to the live environment.
# Do not silently fail over across trading environments on HTTP 401.
env:
  OANDA_ENVIRONMENT: ${{ vars.OANDA_ENVIRONMENT || 'practice' }}
permissions:
  contents: write
concurrency:
  # Serialize with the existing hourly pipeline; never race the immutable plan ledger.
  group: oanda-research-snapshot
  cancel-in-progress: false
jobs:
  fast-shortlist:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test fast research safety and event chronology
        id: safety
        run: |
          for suite in test_fast_entry_scan.py test_signal_admission.py test_watchlist_validation.py test_lifecycle_audit.py test_paper_evidence_guard.py test_simple_paper_shadow_v2.py; do
            python -m unittest discover -s tests -p "$suite" -q || exit 1
          done
      - name: Refresh shortlist, primary news and prospective paper comparison
        id: fast
        continue-on-error: true
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        run: python scripts/fast_entry_scan.py
      - name: Audit validation and actual delivery evidence (no simulated receipt)
        id: validate
        if: steps.fast.outcome == 'success'
        continue-on-error: true
        run: python scripts/forward_validation.py
      - name: Update public FX feed with timestamped fast results
        id: dashboard
        if: steps.fast.outcome == 'success' && steps.validate.outcome == 'success'
        continue-on-error: true
        env:
          FX_DASHBOARD_DEPLOY_TOKEN: ${{ secrets.FX_DASHBOARD_DEPLOY_TOKEN }}
          FX_SAFETY_OUTCOME: ${{ steps.safety.outcome }}
          FX_ADMISSION_OUTCOME: ${{ steps.fast.outcome }}
          FX_WATCH_OUTCOME: ${{ steps.fast.outcome }}
        run: python scripts/export_public_dashboard.py
      - name: Persist immutable plans, paper cohorts, and research observations
        id: persist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/ signals.json
          if [ -f data/signal_plan_archive.json ]; then git add -- data/signal_plan_archive.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: persist timestamped fast FX research [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            # Rebase fails on competing ledger edits: never resolve by discarding evidence.
            git rebase origin/main || exit 1
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Fail visibly after preserving observations
        if: steps.fast.outcome != 'success' || steps.validate.outcome != 'success' || steps.dashboard.outcome != 'success' || steps.persist.outcome != 'success'
        run: exit 1


