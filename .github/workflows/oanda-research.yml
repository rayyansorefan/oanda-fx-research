name: OANDA FX read-only research data
on:
  workflow_dispatch:
  schedule:
    # Hourly only, weekdays 06:07–18:07 UTC.
    # Independent of ChatGPT usage. May miss short-lived M15 entry triggers.
    - cron: '7 6-18 * * 1-5'
permissions:
  contents: write
  issues: write
concurrency:
  group: oanda-research-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline safety tests
        run: python -m unittest discover -s tests -v
      - name: Fetch OANDA raw data (GET only)
        id: collect
        continue-on-error: true
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        run: python scripts/oanda_data.py
      - name: Check at most three authorised research setups
        if: steps.collect.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/signal_watch.py
      - name: Save timestamped snapshot and watcher state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "data: update timestamped OANDA research snapshot [skip ci]"
            git push
          fi
      - name: Fail closed when data retrieval failed
        if: steps.collect.outcome != 'success'
        run: exit 1
